name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      JOBPILOT_TESTING: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -e ".[dev,build]"
      - name: Install browser
        run: python -m playwright install chromium
      - name: Lint
        run: python -m ruff check .
      - name: Check Python formatting
        run: python -m ruff format --check .
      - name: Test
        run: python -m pytest
      - name: Build source and wheel distributions
        run: python -m build
      - name: Smoke test installed wheel
        run: python scripts/smoke-wheel.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: distributions
          path: dist/*

  windows-desktop:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13'
      - run: python -m pip install -e ".[build]"
      - name: Build and verify the Windows installer
        shell: pwsh
        run: |
          $python = (Get-Command python).Source
          ./scripts/Build-JobPilot.ps1 -BuildPython $python
          $install = Join-Path $env:RUNNER_TEMP JobPilot-Smoke
          ./scripts/Install-JobPilot.ps1 -Python $python -InstallRoot $install
          $state = Join-Path $install 'data/preserve.txt'
          Set-Content -LiteralPath $state -Value 'keep'
          ./scripts/Install-JobPilot.ps1 -Python $python -InstallRoot $install -SkipDependencies
          if ((Get-Content -LiteralPath $state) -ne 'keep') { throw 'Update lost user data' }
          $report = Join-Path $env:RUNNER_TEMP jobpilot-diagnostic.json
          $result = Start-Process (Join-Path $install JobPilot.exe) -ArgumentList '--diagnose', '--report', $report -Wait -PassThru
          if ($result.ExitCode -ne 0 -or !(Test-Path -LiteralPath $report)) { throw 'Installed desktop did not report diagnostics' }
      - name: Assemble the downloadable update
        shell: pwsh
        run: |
          git archive --format=zip --output=JobPilot-Windows-source.zip HEAD
          Expand-Archive -Path JobPilot-Windows-source.zip -DestinationPath windows-update
          $payload = New-Item -ItemType Directory -Path windows-update/build/desktop-dist -Force
          Copy-Item -LiteralPath build/desktop-dist/JobPilot -Destination $payload.FullName -Recurse
          Copy-Item scripts/Install-JobPilot-Windows.cmd windows-update
          Compress-Archive -Path windows-update/* -DestinationPath JobPilot-Windows-x64.zip
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: JobPilot-Windows-x64
          path: JobPilot-Windows-x64.zip

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run test:extension
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13'
      - name: Package Chrome extension
        run: python scripts/package_extension.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: JobPilot-Autofill
          path: dist/extension/*.zip
