name: Bug report
description: Report a reproducible problem.
body:
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Include what you expected. Do not include personal data, credentials, or pairing links.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      placeholder: Windows version, Python version, browser version, commit or release
