<!doctype html>
<html lang="en">
  <meta charset="utf-8" /><title>Fictional application fixture</title>
  <form id="application">
    <label>First name<input id="first" autocomplete="given-name" /></label
    ><label>Last name<input id="last" value="User answer" /></label>
    <label>Email address<input id="email" type="email" /></label
    ><label
      >Country<select id="country">
        <option value="">Choose</option>
        <option value="US">United States</option>
      </select></label
    >
    <fieldset>
      <legend>Will you require sponsorship?</legend>
      <label><input type="radio" name="sponsor" value="yes" />Yes</label
      ><label><input type="radio" name="sponsor" value="no" />No</label>
    </fieldset>
    <label>Social security number<input id="ssn" autocomplete="email" /></label
    ><label>I certify my email is accurate<input type="checkbox" id="consent" /></label>
    <label>Password<input id="password" type="password" /></label
    ><label>Why this company?<textarea id="unknown"></textarea></label>
    <fieldset>
      <legend>Employment 1</legend>
      <label>Company<input id="company1" /></label><label>Job title<input id="title1" /></label>
    </fieldset>
    <fieldset>
      <legend>Employment 2</legend>
      <label>Company<input id="company2" /></label><label>Job title<input id="title2" /></label>
    </fieldset>
    <label>Resume<input id="resume" type="file" accept=".pdf,.docx" /></label
    ><label>Cover letter<input id="cover" type="file" /></label>
    <button id="next" type="button">Next</button><button type="submit">Submit</button>
  </form>
  <div id="shadow"></div>
  <iframe id="same" src="frame.html" title="More contact fields"></iframe>
  <script src="fixture.js"></script>
</html>
