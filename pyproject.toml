[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "jobpilot-local"
version = "1.5.0"
description = "A local job discovery and application tracker with ResumeForge tailoring."
readme = "README.md"
requires-python = ">=3.13"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
authors = [{name = "abedabadoo"}]
keywords = ["job-search", "resumeforge", "fastapi", "desktop"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: MacOS :: MacOS X",
  "Programming Language :: Python :: 3.13",
  "Topic :: Office/Business",
]
dependencies = [
  "beautifulsoup4==4.15.0",
  # cryptography 48.0.1 provides the compatible universal2 wheel used by this
  # Python 3.13 Intel build; 50.0.2 otherwise falls back to a Rust source build.
  "cryptography==48.0.1",
  "fastapi==0.143.0",
  "httpx==0.28.1",
  "keyring==25.7.0",
  "lxml==6.1.3",
  "pandas==3.0.6",
  "pillow==12.3.0",
  "pdfplumber>=0.11,<1",
  "pypdfium2>=4.30",
  "PySide6-Essentials==6.11.3; sys_platform == 'win32' or sys_platform == 'darwin'",
  "pystray==0.19.5; sys_platform == 'win32'",
  "python-dateutil==2.9.0.post0",
  "python-jobspy==1.3.0",
  "pythonnet==3.2.1; sys_platform == 'win32'",
  "pywebpush==2.5.0",
  "pywebview==6.2.1; sys_platform == 'win32' or sys_platform == 'darwin'",
  "qrcode==8.2",
  "pypdf==6.20.1",
  "reportlab==4.5.1",
  "requests==2.34.2",
  "tzdata==2026.5",
  "uvicorn==0.54.0",
]

[project.optional-dependencies]
dev = ["build==1.6.1", "playwright==1.63.0", "pytest==9.1.1", "ruff==0.17.1"]
build = ["pyinstaller==6.22.3"]

[project.scripts]
jobpilot-service = "jobpilot.service:main"

[project.urls]
Repository = "https://github.com/abedabadoo/jobpilot"
Issues = "https://github.com/abedabadoo/jobpilot/issues"

[tool.setuptools]
packages = ["jobpilot", "resumeforge"]
include-package-data = true

[tool.setuptools.package-data]
jobpilot = ["candidate.json", "greenhouse_boards.json"]
resumeforge = ["static/*", "fonts/*", "data/*", "*.sh", "*.ps1", "VENDORED_FROM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py313"
line-length = 100
extend-exclude = ["build", "dist", ".venv", "data", "node_modules", "resumeforge"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.format]
quote-style = "double"
